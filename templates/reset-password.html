<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-wrapper {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }

        .form-card {
            padding: 48px;
            display: flex;
            flex-direction: column;
        }

        .form-card h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #111111;
            text-align: center;
        }

        .form-card p {
            font-size: 14px;
            color: #666666;
            margin-bottom: 32px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #444444;
        }

        input {
            padding: 12px 16px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s ease;
            background-color: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: #FAB400;
            background-color: #ffffff;
        }

        input.error {
            border-color: #ff4d4d;
            background-color: #fff5f5;
        }

        .error-message {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: -15px;
            display: none;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
            background-color: #fab300d6;
            color: #ffffff;
        }

        .btn:hover {
            background-color: #FAB400;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .password-hint {
            font-size: 12px;
            color: #888888;
            margin-top: -12px;
        }
    </style>
</head>

<body>
    <div class="main-wrapper">
        <div class="form-card">
            <h2>Set New Password</h2>
            <p>Please choose a strong password that you haven't used before.</p>

            <form id="resetForm" method="POST">
                <div class="input-group">
                    <label for="new-password">New Password</label>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="token" value="{{ token }}">
                    <input type="password" id="new-password" name="new_password" required minlength="8">
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>

                <p id="error-text" class="error-message">Passwords do not match. Please try again.</p>
                <p class="password-hint">Must be at least 8 characters long.</p>

                <button type="submit" class="btn">Update Password</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        const password = document.getElementById('new-password');
        const confirmPassword = document.getElementById('confirm-password');
        const errorText = document.getElementById('error-text');

        form.addEventListener('submit', function (e) {
            if (password.value !== confirmPassword.value) {
                // Prevent form from submitting
                e.preventDefault();

                // Show error state
                errorText.style.display = 'block';
                confirmPassword.classList.add('error');
                password.classList.add('error');
            } else {
                // Passwords match
                errorText.style.display = 'none';
                confirmPassword.classList.remove('error');
                password.classList.remove('error');
                alert("Password updated successfully!");
            }
        });

        // Clear error styling when user starts typing again
        [password, confirmPassword].forEach(input => {
            input.addEventListener('input', () => {
                errorText.style.display = 'none';
                input.classList.remove('error');
            });
        });
    </script>
</body>

</html>
