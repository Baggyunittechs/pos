<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .error-container {
            text-align: center;
            max-width: 450px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 800;
            color: #f0f0f0;
            line-height: 1;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            color: #111111;
            margin-bottom: 16px;
        }

        p {
            font-size: 16px;
            color: #666666;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-block;
            padding: 14px 28px;
            background-color: #0066ff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .btn-home:hover {
            background-color: #0052cc;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1>Lost in space?</h1>
        <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
        <a href="login.html" class="btn-home">Go Back Home</a>
    </div>
</body>
</html>
