<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RM Urbanwear — shirts,sweatpants,hoodies etc..</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/cart.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/index.css')}}">

</head>

<body>
    <header>
        <div class="nav-main">
            <a href="/" class="logo-mark">
                <img src="{{url_for('static', filename='images/logo.png')}}" alt="">
            </a>


            <div class="nav-icons">
                <div class="search-wrap">

                    <input type="text" placeholder="Search hoodies, hats…">
                    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#8A897F" stroke-width="2">
                        <circle cx="11" cy="11" r="7" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                </div>
                <a href="/wishlist" class="icon-btn wishlist">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="2">
                        <path
                            d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />
                    </svg>
                    <span class="badge" id="badge-wishlist">0</span>
                </a>
                <a href="/cart" class="icon-btn">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="2">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                        <path d="M3 6h18" />
                        <path d="M16 10a4 4 0 0 1-8 0" />
                    </svg>
                    <span class="badge" id="badge-cart">0</span>
                </a>
            </div>
        </div>

    </header>

    <aside>
        <a href="/" class="overview">
            <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="48" height="48" viewBox="0 0 48 48"
                stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M 23.951172 4 A 1.50015 1.50015 0 0 0 23.072266 4.3222656 L 8.859375 15.519531 C 7.0554772 16.941163 6 19.113506 6 21.410156 L 6 40.5 C 6 41.863594 7.1364058 43 8.5 43 L 18.5 43 C 19.863594 43 21 41.863594 21 40.5 L 21 30.5 C 21 30.204955 21.204955 30 21.5 30 L 26.5 30 C 26.795045 30 27 30.204955 27 30.5 L 27 40.5 C 27 41.863594 28.136406 43 29.5 43 L 39.5 43 C 40.863594 43 42 41.863594 42 40.5 L 42 21.410156 C 42 19.113506 40.944523 16.941163 39.140625 15.519531 L 24.927734 4.3222656 A 1.50015 1.50015 0 0 0 23.951172 4 z M 24 7.4101562 L 37.285156 17.876953 C 38.369258 18.731322 39 20.030807 39 21.410156 L 39 40 L 30 40 L 30 30.5 C 30 28.585045 28.414955 27 26.5 27 L 21.5 27 C 19.585045 27 18 28.585045 18 30.5 L 18 40 L 9 40 L 9 21.410156 C 9 20.030807 9.6307412 18.731322 10.714844 17.876953 L 24 7.4101562 z">
                </path>
            </svg>

            </i>Overview
        </a>
        <a href="/shop" class="overview">
            <!-- Shop / Store Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="48" height="48" viewBox="0 0 48 48">
                <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                    d="M8 16l2-8h28l2 8" />
                <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                    d="M6 16h36v22a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V16z" />
                <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                    d="M16 42V26h16v16" />
                <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                    d="M12 16v-3" />
                <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                    d="M36 16v-3" />
            </svg>
            shop
        </a>
        <a href="/sales" class="overview">
            <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="48" height="48" viewBox="0 0 48 48">
                <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                    d="M41 25.5L25.5 41a3 3 0 0 1-4.24 0L6 25.76V6h19.76L41 21.26a3 3 0 0 1 0 4.24z" />
                <circle fill="none" stroke="currentColor" stroke-width="3" cx="16" cy="16" r="4" />
            </svg>
            sales
        </a>
        <a href="/cart" class="overview" active>
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                <path d="M3 6h18" />
                <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
            cart
        </a>
    </aside>

    <main>
        <section class="cart-section" style="padding: 0;">
            <div class="shop-header" style="margin-bottom: 10px;">
                <div class="shop-left">
                    <h4>Cart</h4>
                </div>
                <div class="shop-right">
                    <button onclick="openScanner()">Scan Barcode</button>
                </div>

            </div>

            <!-- Scanner Section -->
            <div class="scanner-section" id="scanner-section">
                <div class="header-scanner">
                    <span class="power">Powered by baggyunittechs</span>
                    <span class="close" onclick="openScanner()">
                        <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="10" height="10"
                            viewBox="0 0 50 50">
                            <path
                                d="M 7.71875 6.28125 L 6.28125 7.71875 L 23.5625 25 L 6.28125 42.28125 L 7.71875 43.71875 L 25 26.4375 L 42.28125 43.71875 L 43.71875 42.28125 L 26.4375 25 L 43.71875 7.71875 L 42.28125 6.28125 L 25 23.5625 Z">
                            </path>
                        </svg>
                    </span>
                </div>
                <div class="scanner-video-wrapper">
                    <video id="camera" autoplay playsinline></video>
                    <canvas id="canvas"></canvas>
                </div>
                <div class="scanner-controls">
                    <div class="btn-row">
                        <button class="scan-btn start" id="scanStartBtn">Start</button>
                        <button class="scan-btn stop" id="scanStopBtn" disabled>Stop</button>
                    </div>
                    <div class="scanner-status" id="scanStatus">Ready</div>
                </div>
            </div>

            <div class="cart-container">
                <div class="cart-left">
                    <!-- Cart items rendered by JavaScript -->
                    <button type="button" class="clear-cart-btn">Clear cart</button>
                </div>

                <div class="cart-right">
                    <div class="order-summary">
                        <h2 class="summary-title">Order summary</h2>

                        <div class="summary-row">
                            <span class="summary-label">Subtotal</span>
                            <span class="summary-value">loading..</span>
                        </div>

                        <div class="summary-row">
                            <span class="summary-label">Delivery</span>
                            <span class="summary-value">Calculated on WhatsApp</span>
                        </div>

                        <hr class="summary-divider">

                        <div class="summary-row summary-total">
                            <span class="summary-label">Total</span>
                            <span class="summary-value">loading...</span>
                        </div>

                        <input type="text" placeholder="Your name (optional)" class="summary-input">
                        <input type="tel" placeholder="Phone (optional)" class="summary-input">

                        <button type="button" class="whatsapp-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" class="whatsapp-icon">
                                <path
                                    d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                                </path>
                            </svg>
                            proceed to checkout
                        </button>


                    </div>
                </div>
            </div>

        </section>
    </main>



    <div class="toaster" id="toaster"></div>



    <script src="{{url_for('static', filename='js/wishlist-badge.js')}}"></script>
    <script src="{{url_for('static', filename='js/cart.js')}}"></script>
    <script src="{{ url_for('static', filename='js/cart-badge.js') }}"></script>
</body>

</html>
