<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RM Urbanwear — shirts,sweatpants,hoodies etc..</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/cart.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/index.css')}}">

</head>

<body>
    <header>
        <div class="nav-main">
            <a href="/" class="logo-mark">
                <img src="{{url_for('static', filename='images/logo.png')}}" alt="">
            </a>


            <div class="nav-icons">
                <div class="search-wrap">

                    <input type="text" placeholder="Search hoodies, hats…">
                    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#8A897F" stroke-width="2">
                        <circle cx="11" cy="11" r="7" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                </div>
                <a href="/wishlist" class="icon-btn wishlist">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="2">
                        <path
                            d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />
                    </svg>
                    <span class="badge" id="badge-wishlist">0</span>
                </a>
                <a href="/cart" class="icon-btn">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="2">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                        <path d="M3 6h18" />
                        <path d="M16 10a4 4 0 0 1-8 0" />
                    </svg>
                    <span class="badge" id="badge-cart">0</span>
                </a>
            </div>
        </div>

    </header>

    <aside>
        <a href="/" class="overview">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-home-move">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2" />
                <path d="M19 12h2l-9 -9l-9 9h2v7a2 2 0 0 0 2 2h5.5" />
                <path d="M16 19h6" />
                <path d="M19 16l3 3l-3 3" />
            </svg>

            </i>Overview
        </a>
        <a href="/shop" class="overview">
            <!-- Shop / Store Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-brand-shopee">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M4 7l.867 12.143a2 2 0 0 0 2 1.857h10.276a2 2 0 0 0 2 -1.857l.867 -12.143h-16l-.01 0" />
                <path d="M8.5 7c0 -1.653 1.5 -4 3.5 -4s3.5 2.347 3.5 4" />
                <path
                    d="M9.5 17c.413 .462 1 1 2.5 1s2.5 -.897 2.5 -2s-1 -1.5 -2.5 -2s-2 -1.47 -2 -2c0 -1.104 1 -2 2 -2s1.5 0 2.5 1" />
            </svg>
            shop
        </a>
        <a href="/sales" class="overview">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-tags">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                    d="M3 8v4.172a2 2 0 0 0 .586 1.414l5.71 5.71a2.41 2.41 0 0 0 3.408 0l3.592 -3.592a2.41 2.41 0 0 0 0 -3.408l-5.71 -5.71a2 2 0 0 0 -1.414 -.586h-4.172a2 2 0 0 0 -2 2" />
                <path d="M18 19l1.592 -1.592a4.82 4.82 0 0 0 0 -6.816l-4.592 -4.592" />
                <path d="M7 10h-.01" />
            </svg>
            sales
        </a>
        <a href="/cart" class="overview" active>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-truck-loading">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M2 3h1a2 2 0 0 1 2 2v10a2 2 0 0 0 2 2h15" />
                <path d="M9 9a3 3 0 0 1 3 -3h4a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-4a3 3 0 0 1 -3 -3l0 -2" />
                <path d="M7 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                <path d="M16 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
            </svg>
            cart
        </a>
    </aside>

    <main>
        <section class="cart-section" style="padding: 0;">
            <div class="shop-header" style="margin-bottom: 10px;">
                <div class="shop-left">
                    <h4>Cart</h4>
                </div>
                <div class="shop-right">
                    <button onclick="openScanner()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-scan">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M5 12h14" />
                            <path d="M3 7v-2a2 2 0 0 1 2 -2h2" />
                            <path d="M3 17v2a2 2 0 0 0 2 2h2" />
                            <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                            <path d="M17 21h2a2 2 0 0 0 2 -2v-2" />
                        </svg>
                        Scan Barcode
                    </button>
                </div>

            </div>

            <!-- Scanner Section -->
            <div class="upload-overlay" id="scanner-section">
                <div class="scanner-section">
                    <div class="header-scanner">
                        <span class="power">Powered by baggyunittechs</span>
                        <span class="close" onclick="openScanner()">
                            <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="10" height="10"
                                viewBox="0 0 50 50">
                                <path
                                    d="M 7.71875 6.28125 L 6.28125 7.71875 L 23.5625 25 L 6.28125 42.28125 L 7.71875 43.71875 L 25 26.4375 L 42.28125 43.71875 L 43.71875 42.28125 L 26.4375 25 L 43.71875 7.71875 L 42.28125 6.28125 L 25 23.5625 Z">
                                </path>
                            </svg>
                        </span>
                    </div>
                    <div class="scanner-video-wrapper">
                        <video id="camera" autoplay playsinline></video>
                        <canvas id="canvas"></canvas>
                    </div>
                    <div class="scanner-controls">
                        <div class="btn-row">
                            <button class="scan-btn start" id="scanStartBtn">Start</button>
                            <button class="scan-btn stop" id="scanStopBtn" disabled>Stop</button>
                        </div>
                        <div class="scanner-status" id="scanStatus">Ready</div>
                    </div>
                </div>
            </div>


            <div class="cart-container">
                <div class="cart-left">
                    <button type="button" class="clear-cart-btn">Clear cart</button>
                </div>

                <div class="cart-right">
                    <div class="order-summary">
                        <h2 class="summary-title">Order summary</h2>

                        <div class="summary-row">
                            <span class="summary-label">Subtotal</span>
                            <span class="summary-value">loading..</span>
                        </div>

                        <div class="summary-row">
                            <span class="summary-label">Delivery</span>
                            <span class="summary-value">Calculated on WhatsApp</span>
                        </div>

                        <hr class="summary-divider">

                        <div class="summary-row summary-total">
                            <span class="summary-label">Total</span>
                            <span class="summary-value">loading...</span>
                        </div>

                        <input type="text" placeholder="Your name (optional)" class="summary-input">
                        <input type="tel" placeholder="Phone (optional)" class="summary-input">

                        <button type="button" class="whatsapp-btn">
                            proceed to checkout
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                                stroke-linejoin="round"
                                class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-right-dashed">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M5 12h.5m3 0h1.5m3 0h6" />
                                <path d="M15 16l4 -4" />
                                <path d="M15 8l4 4" />
                            </svg>
                        </button>


                    </div>
                </div>
            </div>

        </section>
    </main>



    <div class="toaster" id="toaster"></div>



    <script src="{{url_for('static', filename='js/wishlist-badge.js')}}"></script>
    <script src="{{url_for('static', filename='js/cart.js')}}"></script>
    <script src="{{ url_for('static', filename='js/cart-badge.js') }}"></script>
</body>

</html>
