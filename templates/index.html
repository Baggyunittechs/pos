<!DOCTYPE html>
<html lang="en">

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edma stores</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/cart.css')}}">
    <!-- Custom Page Loader -->
    <link rel="stylesheet" href="{{url_for('static', filename='css/index.css')}}">

</head>

<body>
    <header>
        <div class="nav-main">
            <a href="/" class="logo-mark">
                <img src="{{url_for('static', filename='images/logo.png')}}" alt="">
            </a>


            <div class="nav-icons">
                <div class="search-wrap">

                    <input type="text" placeholder="Search hoodies, hats…">
                    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#8A897F" stroke-width="2">
                        <circle cx="11" cy="11" r="7" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                </div>
                <a href="/wishlist" class="icon-btn wishlist">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="2">
                        <path
                            d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />
                    </svg>
                    <span class="badge" id="badge-wishlist">0</span>
                </a>
                <a href="/cart" class="icon-btn">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="2">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                        <path d="M3 6h18" />
                        <path d="M16 10a4 4 0 0 1-8 0" />
                    </svg>
                    <span class="badge" id="badge-cart">0</span>
                </a>
            </div>
        </div>

    </header>

    <aside>
        <a href="/" class="overview" active>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-home-move">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2" />
                <path d="M19 12h2l-9 -9l-9 9h2v7a2 2 0 0 0 2 2h5.5" />
                <path d="M16 19h6" />
                <path d="M19 16l3 3l-3 3" />
            </svg>

            </i>Overview
        </a>
        <a href="/shop" class="overview">
            <!-- Shop / Store Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-brand-shopee">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M4 7l.867 12.143a2 2 0 0 0 2 1.857h10.276a2 2 0 0 0 2 -1.857l.867 -12.143h-16l-.01 0" />
                <path d="M8.5 7c0 -1.653 1.5 -4 3.5 -4s3.5 2.347 3.5 4" />
                <path
                    d="M9.5 17c.413 .462 1 1 2.5 1s2.5 -.897 2.5 -2s-1 -1.5 -2.5 -2s-2 -1.47 -2 -2c0 -1.104 1 -2 2 -2s1.5 0 2.5 1" />
            </svg>
            shop
        </a>
        <a href="/sales" class="overview">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-tags">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                    d="M3 8v4.172a2 2 0 0 0 .586 1.414l5.71 5.71a2.41 2.41 0 0 0 3.408 0l3.592 -3.592a2.41 2.41 0 0 0 0 -3.408l-5.71 -5.71a2 2 0 0 0 -1.414 -.586h-4.172a2 2 0 0 0 -2 2" />
                <path d="M18 19l1.592 -1.592a4.82 4.82 0 0 0 0 -6.816l-4.592 -4.592" />
                <path d="M7 10h-.01" />
            </svg>
            sales
        </a>
        <a href="/cart" class="overview">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-truck-loading">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M2 3h1a2 2 0 0 1 2 2v10a2 2 0 0 0 2 2h15" />
                <path d="M9 9a3 3 0 0 1 3 -3h4a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-4a3 3 0 0 1 -3 -3l0 -2" />
                <path d="M7 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                <path d="M16 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
            </svg>
            cart
        </a>
    </aside>

    <main>
        <div class="overview-header">
            <h4>Overview</h4>
            <div class="overview-header-stats">
                <div class="stat" active>
                    <div class="orders">
                        <div class="sale">Revenue</div>
                        <div class="order-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round"
                                class="icon icon-tabler icons-tabler-outline icon-tabler-cash-plus">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M7 15h-3a1 1 0 0 1 -1 -1v-8a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v3" />
                                <path d="M12 19h-4a1 1 0 0 1 -1 -1v-8a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v2.5" />
                                <path d="M12 14a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
                                <path d="M16 19h6" />
                                <path d="M19 16v6" />
                            </svg>
                        </div>
                    </div>
                    <div class="stat-main">
                        <span class="total" id="rev-today">KES 0.00</span>
                        <span class="stat-delta positive" id="rev-today-delta">+0%</span>
                    </div>
                    <svg class="sparkline" id="rev-today-sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">
                        <polyline points="0,20 15,22 30,16 45,18 60,10 75,12 90,6 100,8" />
                    </svg>
                    <span class="month">Today</span>
                </div>


                <div class="stat">
                    <div class="orders">
                        <div class="sale">Sales</div>
                        <div class="order-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-tags">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path
                                    d="M3 8v4.172a2 2 0 0 0 .586 1.414l5.71 5.71a2.41 2.41 0 0 0 3.408 0l3.592 -3.592a2.41 2.41 0 0 0 0 -3.408l-5.71 -5.71a2 2 0 0 0 -1.414 -.586h-4.172a2 2 0 0 0 -2 2" />
                                <path d="M18 19l1.592 -1.592a4.82 4.82 0 0 0 0 -6.816l-4.592 -4.592" />
                                <path d="M7 10h-.01" />
                            </svg>
                        </div>
                    </div>
                    <div class="stat-main">
                        <span class="total" id="total_order">0</span>
                        <span class="stat-delta positive" id="sales-delta">+0%</span>
                    </div>
                    <svg class="sparkline" id="sales-sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">
                        <polyline points="0,24 15,20 30,22 45,14 60,16 75,8 90,10 100,4" />
                    </svg>
                    <span class="month">Today</span>
                </div>



                <div class="stat">
                    <div class="orders">
                        <div class="sale">Revenue</div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-cash-plus">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M7 15h-3a1 1 0 0 1 -1 -1v-8a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v3" />
                            <path d="M12 19h-4a1 1 0 0 1 -1 -1v-8a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v2.5" />
                            <path d="M12 14a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
                            <path d="M16 19h6" />
                            <path d="M19 16v6" />
                        </svg>
                    </div>
                    <div class="stat-main">
                        <span class="total" id="rev-month">KES 0.0</span>
                        <span class="stat-delta positive" id="rev-month-delta">+0%</span>
                    </div>
                    <svg id="rev-month-sparkline" class="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">
                        <polyline points="0,26 15,18 30,20 45,12 60,14 75,6 90,10 100,2" />
                    </svg>
                    <span class="month">This month</span>
                </div>

                <div class="stat">
                    <div class="orders">
                        <div class="sale">Sales</div>
                        <div class="order-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-tags">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path
                                    d="M3 8v4.172a2 2 0 0 0 .586 1.414l5.71 5.71a2.41 2.41 0 0 0 3.408 0l3.592 -3.592a2.41 2.41 0 0 0 0 -3.408l-5.71 -5.71a2 2 0 0 0 -1.414 -.586h-4.172a2 2 0 0 0 -2 2" />
                                <path d="M18 19l1.592 -1.592a4.82 4.82 0 0 0 0 -6.816l-4.592 -4.592" />
                                <path d="M7 10h-.01" />
                            </svg>
                        </div>
                    </div>
                    <div class="stat-main">
                        <span class="total" id="monthly_sales_count"></span>
                        <span class="stat-delta positive" id="sales-month-delta">+0%</span>
                    </div>
                    <svg id="sales-month-sparkline" class="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">
                        <polyline points="0,10 15,14 30,12 45,18 60,16 75,20 90,18 100,22" />
                    </svg>
                    <span class="month">This month</span>
                </div>
                <div class="stat">
                    <div class="orders">
                        <div class="sale">Profit</div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-cash-plus">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M7 15h-3a1 1 0 0 1 -1 -1v-8a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v3" />
                            <path d="M12 19h-4a1 1 0 0 1 -1 -1v-8a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v2.5" />
                            <path d="M12 14a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
                            <path d="M16 19h6" />
                            <path d="M19 16v6" />
                        </svg>
                    </div>
                    <div class="stat-main">
                        <span class="total" id="monthly_profit">99.9%</span>
                        <span class="stat-delta positive" id="monthly_profit_delta">+100%</span>
                    </div>
                    <svg id="monthly_profit_sparkline" class="sparkline" viewBox="0 0 100 30"
                        preserveAspectRatio="none">
                        <polyline points="0,26 15,18 30,20 45,12 60,14 75,6 90,10 100,2" />
                    </svg>
                    <span class="month">This month</span>
                </div>
            </div>



        </div>
        <section class="sales-table-card">
            <div class="sales-table-header">
                <h2>Sales</h2>
                <button id="exportCsvBtn" class="exportCsvBtn">Export to CSV</button>
            </div>

            <div class="sales-table-wrap">
                <table class="sales-table">
                    <thead>
                        <tr>
                            <th>Sale ID</th>
                            <th>Transaction ID</th>
                            <th>Total</th>
                            <th>Profit</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="salesTable">


                    </tbody>
                </table>
            </div>
        </section>


        <div class="charts-row">
            <div class="chart-card">
                <div class="chart-card-header">
                    <div>
                        <span class="chart-title">Sales</span>
                        <span class="chart-sub">Last 7 days</span>
                    </div>
                    <span class="chart-total" id="salesTotal">0</span>
                </div>
                <svg id="salesChart" viewBox="0 0 280 170" class="chart-svg" preserveAspectRatio="none"></svg>
                <div class="chart-labels" id="salesLabels"></div>
            </div>

            <div class="chart-card">
                <div class="chart-card-header">
                    <div>
                        <span class="chart-title">Revenue</span>
                        <span class="chart-sub">Last 7 days</span>
                    </div>
                    <span class="chart-total" id="revenueTotal">KES 0</span>
                </div>
                <svg id="revenueChart" viewBox="0 0 280 170" class="chart-svg" preserveAspectRatio="none"></svg>
                <div class="chart-labels" id="revenueLabels"></div>
            </div>
        </div>


    </main>

    <script src="{{url_for('static', filename='js/wishlist-badge.js')}}"></script>
    <script src="{{url_for('static', filename='js/overview.js')}}"></script>
    <script src="{{ url_for('static', filename='js/cart-badge.js') }}"></script>
</body>

</html>
